name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.eval --verbose

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t law-links-service .
      - run: docker run -d -p 8978:8978 --name law-links-container law-links-service
      - name: Wait for service
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8978/health && exit 0
            sleep 1
          done
          docker logs law-links-container
          exit 1
      - name: Smoke test
        run: |
          curl -sf -X POST http://localhost:8978/detect \
            -H "Content-Type: application/json" \
            -d '{"text": "пп. 1, 2 п. 2 ст. 3 НК РФ"}' | tee out.json
          grep -q '"law_id":15' out.json
